spring.application.name=api

#Tomcat configuration
server.port=9001

#Log level configuration
logging.level.root=INFO
logging.level.com.openclassrooms=INFO
logging.level.org.springframework.boot.autoconfigure.h2=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

#H2 Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

#Postgres configuration
# Les identifiants ne doivent jamais être committés en clair : ils sont lus depuis
# des variables d'environnement (DB_USERNAME / DB_PASSWORD), avec une valeur par
# défaut pour ne pas casser l'environnement de dev local existant.
#spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:admin@user#700?}
#spring.datasource.driver-class-name=org.postgresql.Driver
# Spring Boot can infer this from the URL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true